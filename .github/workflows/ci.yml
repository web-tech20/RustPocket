name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Version épinglée : la CI doit utiliser exactement la même version
          # que le poste de développement (voir app/.metadata).
          # Ne pas repasser à `channel: stable` : les dépréciations d'une
          # nouvelle version cassaient `flutter analyze` sans changement de code.
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test
